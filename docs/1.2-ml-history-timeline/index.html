<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1.2 — Create a timeline | ML for Beginners</title>
    <meta
      name="description"
      content="An interactive timeline of machine learning and AI history, from Bayes' theorem to large language models."
    />
    <link rel="stylesheet" href="../assets/site.css" />
    <link
      rel="stylesheet"
      href="https://cdn.knightlab.com/libs/timeline3/latest/css/timeline.css"
    />
    <style>
      .timeline-page .site-header {
        padding: 3rem 0 2rem;
      }

      .back-link {
        margin: 0 0 1rem;
        font-size: 0.9rem;
      }

      .back-link a {
        font-weight: 600;
        text-decoration: none;
      }

      .timeline-page main {
        padding-top: 2rem;
      }

      .timeline-hint {
        margin: 0 0 1rem;
        color: var(--muted);
      }

      .timeline-status {
        margin: 1rem 0;
        padding: 0.9rem 1rem;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        color: var(--muted);
      }

      .timeline-status.error {
        color: #b42318;
        border-color: #f3b7b1;
        background: #fff4f2;
      }

      #timeline-embed {
        width: 100%;
        height: 72vh;
        min-height: 520px;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
      }

      .timeline-page section + section {
        margin-top: 2.5rem;
      }

      .timeline-page ul {
        padding-left: 1.25rem;
      }

      .timeline-page li + li {
        margin-top: 0.35rem;
      }

      .meta-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        margin-top: 1rem;
        font-size: 0.9rem;
      }

      @media (max-width: 700px) {
        #timeline-embed {
          height: 70vh;
          min-height: 460px;
        }
      }

      @media (prefers-color-scheme: dark) {
        .timeline-status.error {
          color: #ffb4ab;
          border-color: #7a2e2a;
          background: #2a1513;
        }
      }
    </style>
  </head>
  <body class="timeline-page">
    <header class="site-header">
      <div class="wrap">
        <p class="back-link"><a href="../">← Back to all solutions</a></p>
        <p class="eyebrow">Assignment 1.2</p>
      </div>
    </header>

    <main class="wrap">
      <section aria-labelledby="timeline-heading">
        <h2 id="timeline-heading">Timeline</h2>
        <div
          id="timeline-status"
          class="timeline-status"
          role="status"
          aria-live="polite"
        >
          Loading timeline…
        </div>
        <div id="timeline-embed"></div>
        <noscript>
          <p>This timeline requires JavaScript.</p>
        </noscript>
      </section>
      <p class="assignment-link">
        <a
          href="https://github.com/Bklzn/ML-For-Beginners/blob/main/1-Introduction/2-history-of-ML/assignment.md"
        >
          Original assignment
        </a>
      </p>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>
          Built with
          <a href="https://timeline.knightlab.com/">TimelineJS</a> by Knight
          Lab, based on the
          <a
            href="https://github.com/Digital-Humanities-Toolkit/timeline-builder"
          >
            Digital Humanities Toolkit timeline-builder
          </a>
          template.
        </p>
        <p>
          Part of the
          <a href="https://github.com/microsoft/ML-For-Beginners">
            ML for Beginners
          </a>
          curriculum.
        </p>
      </div>
    </footer>

    <script src="https://cdn.knightlab.com/libs/timeline3/latest/js/timeline.js"></script>
    <script>
      const status = document.getElementById("timeline-status");

      fetch("history.json")
        .then((response) => {
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          return response.json();
        })
        .then((data) => {
          if (!window.TL) {
            throw new Error("TimelineJS failed to load.");
          }
          new TL.Timeline("timeline-embed", data);
          status.hidden = true;
        })
        .catch((error) => {
          status.hidden = false;
          status.textContent =
            "Could not load the timeline. Check history.json and the browser console.";
          status.classList.add("error");
          console.error(error);
        });
    </script>
  </body>
</html>
